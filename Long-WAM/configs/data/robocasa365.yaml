train:
  _target_: longwam.datasets.lerobot.robocasa_video_dataset.RoboCasaHuman300VideoDataset
  dataset_dirs: ${oc.load:configs/data/robocasa365_paths.yaml,dataset_dirs}
  expected_dataset_count: 300
  expected_fps: 20
  validate_dataset_contract: true
  human300_episode_selection:
    strategy: official_random_subset
    demos_per_task: 100
    seed: 0
    expected_task_count: 300
    expected_episode_count: 30000
  shape_meta:
    images:
    - key: robot0_agentview_left
      raw_shape:
      - 3
      - 256
      - 256
      shape:
      - 3
      - 256
      - 256
    - key: robot0_agentview_right
      raw_shape:
      - 3
      - 256
      - 256
      shape:
      - 3
      - 256
      - 256
    - key: robot0_eye_in_hand
      raw_shape:
      - 3
      - 256
      - 256
      shape:
      - 3
      - 256
      - 256
    action:
    - key: default
      raw_shape: 12
      shape: 12
    state:
    - key: default
      raw_shape: 16
      shape: 16
  num_frames: 81
  past_obs_size: 48
  action_chunk: 32
  global_sample_stride: 1
  action_video_freq_ratio: 4
  decode_only_sampled_video_frames: true
  video_size:
  - 384
  - 320
  camera_key: null
  val_set_proportion: 0.0
  is_training_set: true
  skip_padding_as_possible: false
  concat_multi_camera: robocasa_left_main
  video_backend: pyav
  pretrained_norm_stats: ${oc.env:ROBOCASA365_NORM_STATS,${oc.env:LONGWAM_DATA_ROOT,./data}/robocasa365/cache/human300_norm_stats.json}
  processor:
    _target_: longwam.datasets.lerobot.processors.longwam_processor.LongWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_image_steps: 21
    num_output_cameras: 3
    action_output_dim: 12
    proprio_output_dim: 16
    delta_action_dim_mask:
      default:
      - true
      - true
      - true
      - true
      - false
      - true
      - true
      - true
      - true
      - true
      - true
      - false
    action_state_transforms: null
    use_stepwise_action_norm: false
    norm_default_mode: min/max
    norm_exception_mode: null
    action_state_merger:
      _target_: longwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
    - _target_: longwam.datasets.lerobot.transforms.image.ToTensor
    val_transforms:
    - _target_: longwam.datasets.lerobot.transforms.image.ToTensor
  text_embedding_cache_dir: ${oc.env:ROBOCASA365_TEXT_CACHE,${oc.env:LONGWAM_DATA_ROOT,./data}/robocasa365/cache/text_embeds/human300}
  context_len: 128
  expose_task_family_domains: true

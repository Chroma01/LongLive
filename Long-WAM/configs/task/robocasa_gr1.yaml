defaults:
- override /data: robocasa_gr1
- override /model: long_wam
- override /context: p384
- _self_
output_dir: ${oc.env:LONGWAM_OUTPUT_ROOT,./outputs}/robocasa_gr1/${now:%Y%m%d_%H%M%S}
batch_size: ${context.batch_size}
num_workers: 12
lr_scheduler_type: cosine_hf
learning_rate: 3.0e-05
num_epochs: 300
max_steps: 30000
save_every: 5000
save_state_every: 5000
eval_every: 0
gradient_accumulation_steps: ${context.gradient_accumulation_steps}
weight_decay: 1.0e-05
checkpoint_strict: true
wandb:
  name: robocasa_gr1
  group: robocasa_gr1
prefetch_factor: 2
adam_beta1: 0.95
adam_beta2: 0.999
adam_epsilon: 1.0e-08
lr_warmup_ratio: 0.05
scheduler_max_steps: 30000
expected_global_batch_size: 480
model_init_seed: 42
model:
  longwam_past_obs_size: ${context.past_obs_size}

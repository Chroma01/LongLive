defaults:
- override /data: libero
- override /model: long_wam
- _self_
output_dir: ${oc.env:LONGWAM_OUTPUT_ROOT,./outputs}/libero/${now:%Y%m%d_%H%M%S}
batch_size: 8
num_workers: 8
num_epochs: 10
save_every: 2000
eval_every: 0
gradient_accumulation_steps: 2
weight_decay: 0.01
wandb:
  name: libero
  group: libero
expected_global_batch_size: 128
model_init_seed: 42
adam_beta1: 0.9
adam_beta2: 0.95
adam_epsilon: 1.0e-08
model: {}

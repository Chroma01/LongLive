infra:
  sequence_parallel_size: 8
  sharding_strategy: hybrid_full
  mixed_precision: true
  gradient_checkpointing: false
  vae_halo_latents: 28
  generator_fsdp_wrap_strategy: size
  text_encoder_fsdp_wrap_strategy: size
model_kwargs:
  model_name: Wan2.2-TI2V-5B
  initialize_from_config: true
  timestep_shift: 5.0
  num_frame_per_block: 8
  local_attn_size: 64
  sink_size: 0
  t_scale: 1.0
  rope_method: linear
checkpoints:
  generator_ckpt: ${oc.env:LONGWAM_VIDEO_VALIDATION_CHECKPOINT_MODEL}
  generator_ckpt_load_mode: generator_only
algorithm:
  trainer: diffusion
  i2v: true
  causal: true
  teacher_forcing: true
  independent_first_frame: true
  num_train_timestep: 1000
  denoising_loss_type: flow
  noise_augmentation_max_timestep: 0
training:
  lr: 5.0e-06
  weight_decay: 0.0
  beta1: 0.0
  beta2: 0.999
  batch_size: 1
  gradient_accumulation_steps: 1
  max_grad_norm: 10.0
  ema_weight: 0.0
  ema_start_step: 0
  max_iters: 1
  log_iters: 1
  max_checkpoints: 0
  gc_interval: 100
  error_recycling:
    enabled: false
    num_buckets: 50
    buffer_size_per_bucket: 500
    buffer_warmup_iter: 50
    context_inject_prob: 0.9
    latent_inject_prob: 0.9
    noise_inject_prob: 0.01
    clean_prob: 0.2
    clean_buffer_update_prob: 0.1
    modulate_factor: 0.3
    start_step: 0
    replacement_strategy: random
data:
  data_path: ${oc.env:LONGWAM_VIDEO_DATA_ROOT}/manifests/S/train.jsonl
  eval_data_path: ${oc.env:LONGWAM_VIDEO_DATA_ROOT}/manifests/S/val.jsonl
  manifest_stage: S
  manifest_split: train
  manifest_receipt_path: ${oc.env:LONGWAM_VIDEO_DATA_ROOT}/receipt.json
  manifest_receipt_sha256: 0a68f0c07a05d7bab571ea205d108c4ad0f0bca0509cc639cb796e6aaee21976
  manifest_index_cache_dir: ${oc.env:LONGWAM_VIDEO_INDEX_CACHE}
  image_or_video_shape:
  - 1
  - 64
  - 48
  - 44
  - 80
  load_raw_video: true
  allow_padding: true
  min_latent_frames: 24
  single_video_only: true
  uniform_prompt: true
  max_chunks_per_shot: 0
  shuffle: false
  drop_last: false
inference:
  sampling_steps: 50
  local_attn_size: 64
  sink_size: 0
  multi_shot_sink: false
  multi_shot_rope_offset: 0
  guidance_scale: 3.0
  independent_first_frame: true
evaluation:
  interval: 0
  evaluate_at_end: false
  num_frames: 64
  weights: model
  use_ema: false
  val_batch_size: 1
  save_latents_only: false
  seed: 20260711
  sample_ids: []
  groups:
  - name: short_f32
    num_frames: 32
    eval_data_path: ${oc.env:LONGWAM_VIDEO_DATA_ROOT}/manifests/S/val.jsonl
    seed: 20260711
    sample_ids:
    - 22ae85db72bcf5a9346a71865390c7b6
    - bcc7dce98ed5030a7cab8d4dcf17c2ef
    - cf3a8b6511d80a95e2369e2c84358733
    - 03b49b193c035265db2b3e76bfd6e0f1
    - 05ea7d2ba909ce9374491a1c2256fc40
    - 44e2b73d2470b5b5539f92b4bd798c23
  - name: long_f64
    num_frames: 64
    eval_data_path: ${oc.env:LONGWAM_VIDEO_DATA_ROOT}/manifests/S/val.jsonl
    seed: 20260711
    sample_ids:
    - d5b1e192d6244f51f08ced440653a36f
    - 92ef2fb546840871d16b7471abd2d11a
    - 6cf8ca8427a34667dce89842a474db0b
    - 3a2d148cd4cb819f6a4cc38ba1f1b019
    - e365c773a4a40e2b7c4f4c373b9cfe1b
    - f6a9d9bdff512a8f991f33132834c13c
logging:
  seed: 20260711
  wandb_key: null
  wandb_mode: offline
  wandb_entity: ${oc.env:WANDB_ENTITY,null}
  wandb_project: ${oc.env:WANDB_PROJECT,robot-video}
  wandb_name: validation_s
  wandb_group: robot-video
  wandb_job_type: validation
  wandb_tags:
  - robot-video
  - validation_s

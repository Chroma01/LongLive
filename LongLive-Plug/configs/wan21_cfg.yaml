infra:
  sharding_strategy: full
  mixed_precision: true
  gradient_checkpointing: true
  generator_fsdp_wrap_strategy: size
  real_score_fsdp_wrap_strategy: size
  text_encoder_fsdp_wrap_strategy: size
  text_encoder_cpu_offload: false
model_kwargs:
  model_name: Wan2.1-T2V-14B
  model_dir: ${oc.env:WAN_MODEL_ROOT,wan_models}/Wan2.1-T2V-14B
  timestep_shift: 5.0
  num_frame_per_block: 3
checkpoints:
  lora_ckpt: null
algorithm:
  trainer: score_distillation
  distribution_loss: cfg_guidance
  sfp_training: false
  backward_simulation: false
  cfg_state_source: teacher_trajectory_cache
  teacher_guidance_scale: 5.0
  teacher_sampling_steps: 50
  cfg_distill_loss_weighting: relative_guidance
  cfg_relative_guidance_epsilon: 1.0e-06
  cfg_relative_guidance_max_weight: 16.0
  cfg_verify_cache_hashes: false
training:
  lr: 1.0e-05
  weight_decay: 0.01
  beta1: 0.0
  beta2: 0.999
  batch_size: 2
  gradient_accumulation_steps: 1
  log_iters: 25
  max_checkpoints: 8
  max_iters: 250
  gc_interval: 25
  max_grad_norm_generator: 10.0
data:
  data_path: ${oc.env:LONGLIVE_DATA_ROOT,data}/wan21_cfg_cache/manifest.json
  eval_data_path: ${oc.env:LONGLIVE_DATA_ROOT,data}/heldout.txt
  data_num_workers: 0
  data_seed: 0
  image_or_video_shape:
  - 2
  - 21
  - 16
  - 60
  - 104
inference:
  sampling_steps: 50
  guidance_scale: 1.0
evaluation:
  interval: -1
  before_train: false
  num_frames: 21
  val_batch_size: 1
  save_latents_only: true
adapter:
  type: lora
  rank: 128
  alpha: 128
  dropout: 0.0
  apply_to_critic: false
  expected_target_modules: 400
  verbose: false
logging:
  seed: 0
  randomize_seed: false
  wandb_entity: null
  wandb_project: LongLive-Plug
